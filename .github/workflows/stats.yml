name: Test Write Permission

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test
        run: |
          echo "GitHub Actions can write!" > actions-test.txt

      - name: Commit test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add actions-test.txt
          git commit -m "Test GitHub Actions write permission"
          git push
